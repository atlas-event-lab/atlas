# ──────────────────────────────────────────────────────────────────────────
# Default values for an Atlas service.
# Deploy one release per service:  helm upgrade --install <svc> . -f values/<svc>.yaml
# Port convention (SPEC-DEPLOY-001 §1.1): 8080 business API, 9090 actuator/management.
# ──────────────────────────────────────────────────────────────────────────

nameOverride: ""
fullnameOverride: ""

image:
  # Override per service, e.g. ghcr.io/<org>/atlas-booking-service
  repository: ghcr.io/atlas-event-lab/atlas-service
  tag: ""                     # empty -> .Chart.AppVersion (":latest" by default)
  pullPolicy: Always          # ":latest" moves; Always keeps pods on the newest main build.
                              # Pin image.tag to a fixed tag + set IfNotPresent for reproducibility.
imagePullSecrets: []           # e.g. [{ name: ghcr-pull }]

replicaCount: 1

# Spring profile for every service in the cluster. Rendered as SPRING_PROFILES_ACTIVE.
# NOT optional: each service's logback-spring.xml binds the JSON appender to `prod,monitoring`
# and the plain-text one to `default,local,dev`. Deploying on the default profile therefore
# emits unstructured logs, which Loki cannot parse into fields — no correlation_id filtering,
# no per-service labels. Use `local`/`dev` only when running outside the cluster.
springProfile: prod

ports:
  http: 8080                   # server.port
  management: 9090             # management.server.port (actuator)

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Probes hit the Spring Boot health groups on the management port (9090), made public by
# the dedicated actuator SecurityFilterChain in each service.
probes:
  type: http            # http = GET actuator health on probes.port | tcp = TCP fallback on http port
  port: management      # 9090 (actuator). Only relevant for type=http.
  startup:
    path: /actuator/health/readiness
    periodSeconds: 5
    failureThreshold: 30       # ~150s budget for slow JVM start
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 10
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Hand the replica count to an EXTERNAL autoscaler — a KEDA ScaledObject applied separately
# (deploy/platform/keda). Use this instead of `autoscaling.enabled` when scaling on Kafka lag
# rather than CPU: payment-service is I/O-bound, so its CPU barely moves while the consumer
# lag grows (ADR-0015, experiments/01-high-booking-concurrency/payment-service-scaling.md).
#
# Why a separate flag instead of just `autoscaling.enabled: false`:
#   • `autoscaling.enabled: false` would render `spec.replicas` — and ArgoCD (selfHeal: true)
#     then re-asserts that number on every sync, fighting KEDA for the replica count.
#   • `autoscaling.enabled: true` renders a CPU HPA named after the release. KEDA's admission
#     webhook then REFUSES the ScaledObject ("already managed by the hpa '<release>'"), because
#     two autoscalers may not own one workload.
# So KEDA-scaled services need BOTH omitted: no HPA and no replicas. That is what this does.
#
# Set it together with `autoscaling.enabled: false`, and apply the matching ScaledObject.
keda:
  enabled: false

# Spread replicas across nodes (turn on for HA services: booking/inventory/payment).
podAntiAffinity:
  enabled: false

# Non-secret config -> ConfigMap -> injected via envFrom.
config: {}
#  KAFKA_BOOTSTRAP_SERVERS: atlas-kafka-bootstrap:9092
#  KEYCLOAK_ISSUER_URI: http://keycloak.atlas-system/realms/atlas

# Secret with DB creds etc. Created out-of-band (SealedSecret); injected via envFrom.
envSecret:
  enabled: false
  name: ""                     # e.g. booking-secret

# Extra individual env entries (raw k8s env list: name/value or name/valueFrom).
extraEnv: []

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

# Prometheus scrape annotations (wired in Phase 6; off until actuator exposes /prometheus).
metrics:
  enabled: true
  path: /actuator/prometheus

nodeSelector: {}
tolerations: []
