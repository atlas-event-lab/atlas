# hotel-service — hotel catalog (publishes events via outbox). Baseline: replica 1, no HPA.
# Deploy:  helm upgrade --install hotel-service ../atlas-service -f hotel.yaml -n atlas-apps

image:
  repository: ghcr.io/atlas-event-lab/atlas-hotel-service
  tag: ""

config:
  KAFKA_BOOTSTRAP_SERVERS: atlas-kafka-bootstrap.atlas-data:9092
  DB_URL: jdbc:postgresql://atlas-pg-pooler-rw.atlas-data:5432/hotel_db?prepareThreshold=0
  FLYWAY_DB_URL: jdbc:postgresql://atlas-pg-rw.atlas-data:5432/hotel_db
  INVENTORY_SERVICE_URL: http://inventory-service:8080

envSecret:
  enabled: true
  name: hotel-secret              # keys: DB_USERNAME, DB_PASSWORD (SealedSecret)

# Public Keycloak issuer (the `iss` browser-login JWTs carry; validated by this service).
# Injected from the `atlas-issuer` Secret so the public host/IP is NOT committed. The Secret
# is a per-cluster prerequisite — see DEPLOYMENT-RUNBOOK.md § "App secret — atlas-issuer".
extraEnv:
  - name: KEYCLOAK_ISSUER_URI
    valueFrom:
      secretKeyRef:
        name: atlas-issuer
        key: KEYCLOAK_ISSUER_URI
