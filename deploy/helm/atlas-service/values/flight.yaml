# flight-service — flight catalog (publishes events via outbox). Baseline: replica 1, no HPA.
# Deploy:  helm upgrade --install flight-service ../atlas-service -f flight.yaml -n atlas-apps

image:
  repository: ghcr.io/atlas-event-lab/atlas-flight-service
  tag: "sha-7a38d93392e0eb816b7991b9ba19ba36fd063587"
config:
  KAFKA_BOOTSTRAP_SERVERS: atlas-kafka-bootstrap.atlas-data:9092
  DB_URL: jdbc:postgresql://atlas-pg-pooler-rw.atlas-data:5432/flight_db?prepareThreshold=0
  FLYWAY_DB_URL: jdbc:postgresql://atlas-pg-rw.atlas-data:5432/flight_db
  # EXPERIMENTO (rama exp/pg-resources-pool1): Hikari alineado con el pooler.
  # Nombres en formato relaxed-binding de Spring: punto -> "_", GUION ELIMINADO, mayusculas.
  # Un guion aqui haria que kubelet descarte la variable (no es un C_IDENTIFIER valido).
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "2"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_BASELINE_VERSION: "0"
  INVENTORY_SERVICE_URL: http://inventory-service:8080
envSecret:
  enabled: true
  name: flight-secret # keys: DB_USERNAME, DB_PASSWORD (SealedSecret)
# Public Keycloak issuer (the `iss` browser-login JWTs carry; validated by this service).
# Injected from the `atlas-issuer` Secret so the public host/IP is NOT committed. The Secret
# is a per-cluster prerequisite — see DEPLOYMENT-RUNBOOK.md § "App secret — atlas-issuer".
extraEnv:
  - name: KEYCLOAK_ISSUER_URI
    valueFrom:
      secretKeyRef:
        name: atlas-issuer
        key: KEYCLOAK_ISSUER_URI
