# payment-service — Saga participant (charges via Fake Payment Provider).
# HA: anti-affinity + KEDA min 1 / max 4 (scaled on Kafka consumer lag, NOT CPU).
# PAYMENT_PROVIDER_URL points at the WireMock fake provider, which must be deployed in atlas-apps.
# Deploy:  helm upgrade --install payment-service ../atlas-service -f payment.yaml -n atlas-apps
#          kubectl apply -f deploy/platform/keda/payment-scaledobject.yaml   # owns the replicas

image:
  repository: ghcr.io/atlas-event-lab/atlas-payment-service
  tag: "sha-fee2a1273a442ef4bb92a0c3648ce948ae9701b0"
# Scaled by KEDA, not by CPU. payment-service is I/O-bound (provider HTTP + JDBC), so CPU
# utilisation barely moves while the `inventory.reserved` consumer lag grows — the CPU HPA
# under-scales it exactly when it matters. The KEDA Kafka scaler reads that lag from the
# broker instead. Rationale: ADR-0015 and
# experiments/01-high-booking-concurrency/payment-service-scaling.md §3.1.
#
# Both flags below are load-bearing, and must move together:
#   autoscaling.enabled: false  — no CPU HPA. If one existed, KEDA's admission webhook would
#                                 REFUSE the ScaledObject ("already managed by the hpa
#                                 'payment-service'") and payment would silently fall back to
#                                 CPU scaling.
#   keda.enabled: true          — also omit `spec.replicas`, so ArgoCD (selfHeal) does not
#                                 re-assert a fixed count on every sync and fight KEDA.
# The replica bounds now live in the ScaledObject (minReplicaCount/maxReplicaCount), not here.
autoscaling:
  enabled: false
keda:
  enabled: true
podAntiAffinity:
  enabled: true
config:
  KAFKA_BOOTSTRAP_SERVERS: atlas-kafka-bootstrap.atlas-data:9092
  DB_URL: jdbc:postgresql://atlas-pg-pooler-rw.atlas-data:5432/payment_db?prepareThreshold=0
  FLYWAY_DB_URL: jdbc:postgresql://atlas-pg-rw.atlas-data:5432/payment_db
  # EXPERIMENTO (rama exp/pg-resources-pool1): Hikari alineado con el pooler.
  # Nombres en formato relaxed-binding de Spring: punto -> "_", GUION ELIMINADO, mayusculas.
  # Un guion aqui haria que kubelet descarte la variable (no es un C_IDENTIFIER valido).
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "8"
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "2"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_BASELINE_VERSION: "0"
  PAYMENT_PROVIDER_URL: http://wiremock.atlas-apps:8080
  # ADR-0015: 4 pods (KEDA max) x concurrency 3 = 12 consumers = 12 partitions of inventory.reserved.
  KAFKA_CONCURRENCY: "3"
envSecret:
  enabled: true
  name: payment-secret # keys: DB_USERNAME, DB_PASSWORD (SealedSecret)
# Public Keycloak issuer (the `iss` browser-login JWTs carry; validated by this service).
# Injected from the `atlas-issuer` Secret so the public host/IP is NOT committed. The Secret
# is a per-cluster prerequisite — see DEPLOYMENT-RUNBOOK.md § "App secret — atlas-issuer".
extraEnv:
  - name: KEYCLOAK_ISSUER_URI
    valueFrom:
      secretKeyRef:
        name: atlas-issuer
        key: KEYCLOAK_ISSUER_URI
