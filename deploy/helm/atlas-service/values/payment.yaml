# payment-service — Saga participant (charges via Fake Payment Provider). HA: anti-affinity + HPA min 2.
# PAYMENT_PROVIDER_URL points at the WireMock fake provider, which must be deployed in atlas-apps.
# Deploy:  helm upgrade --install payment-service ../atlas-service -f payment.yaml -n atlas-apps

image:
  repository: ghcr.io/atlas-event-lab/atlas-payment-service
  tag: ""

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podAntiAffinity:
  enabled: true

config:
  KAFKA_BOOTSTRAP_SERVERS: atlas-kafka-bootstrap.atlas-data:9092
  DB_URL: jdbc:postgresql://atlas-pg-rw.atlas-data:5432/payment_db
  PAYMENT_PROVIDER_URL: http://wiremock.atlas-apps:8080
  # ADR-0015: 4 pods (KEDA max) x concurrency 3 = 12 consumers = 12 partitions of inventory.reserved.
  KAFKA_CONCURRENCY: "3"

envSecret:
  enabled: true
  name: payment-secret            # keys: DB_USERNAME, DB_PASSWORD (SealedSecret)

# Public Keycloak issuer (the `iss` browser-login JWTs carry; validated by this service).
# Injected from the `atlas-issuer` Secret so the public host/IP is NOT committed. The Secret
# is a per-cluster prerequisite — see DEPLOYMENT-RUNBOOK.md § "App secret — atlas-issuer".
extraEnv:
  - name: KEYCLOAK_ISSUER_URI
    valueFrom:
      secretKeyRef:
        name: atlas-issuer
        key: KEYCLOAK_ISSUER_URI
