# inventory-service — Saga participant (reservation locks). HA: anti-affinity + HPA min 2.
# Deploy:  helm upgrade --install inventory-service ../atlas-service -f inventory.yaml -n atlas-apps

image:
  repository: ghcr.io/atlas-event-lab/atlas-inventory-service
  tag: "sha-88695d1ef35c2a515a57c5725b8044c3cf73c08c" # bootstrap only — the service CI write-back overwrites with sha-<commit>
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
podAntiAffinity:
  enabled: true
config:
  KAFKA_BOOTSTRAP_SERVERS: atlas-kafka-bootstrap.atlas-data:9092
  DB_URL: jdbc:postgresql://atlas-pg-pooler-rw.atlas-data:5432/inventory_db?prepareThreshold=0
  FLYWAY_DB_URL: jdbc:postgresql://atlas-pg-rw.atlas-data:5432/inventory_db
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_BASELINE_VERSION: "0"
envSecret:
  enabled: true
  name: inventory-secret # keys: DB_USERNAME, DB_PASSWORD (SealedSecret)
# Public Keycloak issuer (the `iss` browser-login JWTs carry; validated by this service).
# Injected from the `atlas-issuer` Secret so the public host/IP is NOT committed. The Secret
# is a per-cluster prerequisite — see DEPLOYMENT-RUNBOOK.md § "App secret — atlas-issuer".
extraEnv:
  - name: KEYCLOAK_ISSUER_URI
    valueFrom:
      secretKeyRef:
        name: atlas-issuer
        key: KEYCLOAK_ISSUER_URI
