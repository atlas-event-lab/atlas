# travel-cart-service — pre-booking cart, REST-only (no Kafka). CPU HPA, 1–3 replicas.
# Frankfurter FX is an external API (hardcoded default), so no env needed for it.
# Deploy:  helm upgrade --install travel-cart-service ../atlas-service -f travel-cart.yaml -n atlas-apps

image:
  repository: ghcr.io/atlas-event-lab/atlas-travel-cart-service
  tag: ""

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Spread the replicas across nodes — pointless at 1 pod, meaningful now that it can reach 3.
podAntiAffinity:
  enabled: true

config:
  DB_URL: jdbc:postgresql://atlas-pg-rw.atlas-data:5432/travel_cart_db
  REDIS_HOST: redis.atlas-data
  REDIS_PORT: "6379"

envSecret:
  enabled: true
  name: travel-cart-secret        # keys: DB_USERNAME, DB_PASSWORD (SealedSecret)

extraEnv:
  - name: KEYCLOAK_ISSUER_URI
    valueFrom:
      secretKeyRef:
        name: atlas-issuer
        key: KEYCLOAK_ISSUER_URI
