{{- /*
  Two autoscalers may never own one Deployment. KEDA's admission webhook enforces this at
  apply time ("already managed by the hpa '<release>'") — catching it here instead means the
  contradiction never reaches the cluster, and the message says what to do.
*/ -}}
{{- if and .Values.autoscaling.enabled (.Values.keda).enabled -}}
{{- fail (printf "%s: autoscaling.enabled and keda.enabled are both true. A Deployment can have only ONE autoscaler: set autoscaling.enabled=false to let the KEDA ScaledObject own the replica count (deploy/platform/keda), or keda.enabled=false to use the chart's CPU HPA." (include "atlas-service.fullname" .)) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas-service.fullname" . }}
  labels:
    {{- include "atlas-service.labels" . | nindent 4 }}
spec:
  {{- /*
    Omit `replicas` when ANY autoscaler owns the count — the chart's CPU HPA, or an external
    KEDA ScaledObject. Rendering it would make ArgoCD (selfHeal) re-assert a fixed number on
    every sync and fight the autoscaler.
  */}}
  {{- if not (or .Values.autoscaling.enabled (.Values.keda).enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "atlas-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atlas-service.labels" . | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.ports.management | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "atlas-service.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "atlas-service.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "atlas-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.ports.management }}
              protocol: TCP
          envFrom:
            {{- if .Values.config }}
            - configMapRef:
                name: {{ include "atlas-service.fullname" . }}-config
            {{- end }}
            {{- if .Values.envSecret.enabled }}
            - secretRef:
                name: {{ required "envSecret.name is required when envSecret.enabled" .Values.envSecret.name }}
            {{- end }}
          env:
            # Spring profile. Declared here rather than in `config:` so a per-service values
            # file cannot drop it by redefining that map, and so it is visible in
            # `kubectl describe pod`. On the DEFAULT profile each service's logback-spring.xml
            # selects the plain-text console appender; `prod` selects the JSON one
            # (LogstashEncoder), which is what Loki parses and what SEC/OBS require.
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Probe strategy:
          #   tcp  = TCP check on the app port (no auth) — works while actuator sits on the
          #          secured management port (9090). Use this until actuator is moved to 8080.
          #   http = HTTP GET /actuator/health on the given port (proper health check).
          {{- if eq .Values.probes.type "http" }}
          startupProbe:
            httpGet: { path: {{ .Values.probes.startup.path }}, port: {{ .Values.probes.port }} }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet: { path: {{ .Values.probes.liveness.path }}, port: {{ .Values.probes.port }} }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readiness.path }}, port: {{ .Values.probes.port }} }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- else }}
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
