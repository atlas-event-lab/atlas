# Wave 2 — Strimzi Kafka operator (ships the kafka.strimzi.io CRDs used by the wave-3 Kafka +
# wave-4 KafkaTopics). Watches atlas-data.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: atlas
  source:
    repoURL: https://strimzi.io/charts
    chart: strimzi-kafka-operator
    targetRevision: 0.45.0
    helm:
      releaseName: strimzi
  destination:
    server: https://kubernetes.default.svc
    namespace: atlas-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
