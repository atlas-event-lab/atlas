# Grafana datasource for Loki — auto-loaded by the kube-prometheus-stack Grafana sidecar.
# derivedFields: extract traceId from the JSON logs (Micrometer puts it in MDC) and link to
# Tempo, so from a log line you jump to its distributed trace.
# Apply:  kubectl apply -f loki-datasource.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: atlas-observability
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.atlas-observability.svc   # verify svc name if this fails
        isDefault: false
        jsonData:
          derivedFields:
            - name: TraceID
              matcherType: regex
              matcherRegex: '"traceId":"(\w+)"'
              url: '$${__value.raw}'
              datasourceUid: tempo
