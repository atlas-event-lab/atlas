# Grafana dashboard — Atlas Kafka / Event Backbone. Phase 7.
# Auto-loaded by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard: "1").
# Consumer lag / throughput / DLQ come from the kafka-exporter (already enabled). The broker
# JMX row (kafka_server_*/kafka_network_*/kafka_controller_*) needs kafka-metrics-configmap.yaml
# + spec.kafka.metricsConfig (kafka.yaml). Broker metric names depend on that ruleset — verify
# in Prometheus after enabling. The $consumergroup / $topic vars auto-discover from the exporter.
# Apply:  kubectl apply -f atlas-kafka-dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-kafka-dashboard
  namespace: atlas-observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Atlas"
data:
  atlas-kafka-dashboard.json: |
    {
      "uid": "atlas-kafka",
      "title": "Atlas \u2014 Kafka / Event Backbone",
      "tags": [
        "atlas",
        "kafka",
        "phase7"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": {},
            "refresh": 1,
            "hide": 0
          },
          {
            "name": "consumergroup",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "label": "Consumer group",
            "query": {
              "query": "label_values(kafka_consumergroup_lag, consumergroup)",
              "refId": "var"
            },
            "definition": "label_values(kafka_consumergroup_lag, consumergroup)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "payment-service",
              "value": "payment-service"
            }
          },
          {
            "name": "topic",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "label": "Topic",
            "query": {
              "query": "label_values(kafka_topic_partition_current_offset, topic)",
              "refId": "var"
            },
            "definition": "label_values(kafka_topic_partition_current_offset, topic)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Salud \u2014 de un vistazo",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Brokers online",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kafka_brokers",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Lag total (todos los grupos)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1000
                  },
                  {
                    "color": "red",
                    "value": 10000
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kafka_consumergroup_lag)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Particiones under-replicated",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kafka_topic_partition_under_replicated_partition)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "description": "Debe ser 0. >0 en modo 3-broker = replicaci\u00f3n en riesgo."
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Ingress (msg/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(kafka_topic_partition_current_offset[$__rate_interval]))",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Consumer lag",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Lag por consumer group",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (consumergroup) (kafka_consumergroup_lag)",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{consumergroup}}"
            }
          ],
          "description": "El coraz\u00f3n: qui\u00e9n se rezaga."
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Segundos detr\u00e1s (staleness) por grupo",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (consumergroup)(kafka_consumergroup_lag) / clamp_min(sum by (consumergroup)(rate(kafka_consumergroup_current_offset[$__rate_interval])),1)",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{consumergroup}}"
            }
          ],
          "description": "lag / tasa de consumo = cu\u00e1n stale est\u00e1 cada grupo."
        },
        {
          "id": 9,
          "type": "table",
          "title": "Lag por partici\u00f3n \u2014 grupo $consumergroup",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "topic": "Topic",
                  "partition": "Partici\u00f3n",
                  "Value": "Lag"
                }
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (topic, partition) (kafka_consumergroup_lag{consumergroup=~\"$consumergroup\"})",
              "refId": "A",
              "range": false,
              "instant": true,
              "format": "table"
            }
          ],
          "description": "Detecta skew: una partici\u00f3n caliente vs el resto."
        },
        {
          "id": 10,
          "type": "row",
          "title": "Throughput \u2014 producido vs consumido",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Producido por t\u00f3pico (msg/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (topic)(rate(kafka_topic_partition_current_offset[$__rate_interval]))",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{topic}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Consumido por grupo (msg/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (consumergroup)(rate(kafka_consumergroup_current_offset[$__rate_interval]))",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{consumergroup}}"
            }
          ],
          "description": "Si consumido < producido, el lag de ese grupo crece."
        },
        {
          "id": 13,
          "type": "row",
          "title": "Escalado \u2194 lag (correlaci\u00f3n con Kubernetes)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "panels": []
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "R\u00e9plicas por servicio (Saga)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "stepAfter",
                "fillOpacity": 0,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kube_deployment_status_replicas{namespace=\"atlas-apps\", deployment=~\"booking-service|payment-service|inventory-service|search-service\"}",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{deployment}}"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Payment \u2014 CPU util % vs request",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "100 * sum(rate(container_cpu_usage_seconds_total{namespace=\"atlas-apps\",pod=~\"payment-service.*\",container!=\"\"}[$__rate_interval])) / clamp_min(sum(kube_pod_container_resource_requests{namespace=\"atlas-apps\",pod=~\"payment-service.*\",resource=\"cpu\"}),0.001)",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "CPU util %"
            }
          ],
          "description": "Junto al lag de payment abajo: visualiza el desacople I/O-bound (lag alto, CPU baja)."
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Payment \u2014 lag",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(kafka_consumergroup_lag{consumergroup=\"payment-service\"})",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "lag"
            }
          ]
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "HPA \u2014 current vs desired replicas",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 40
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "stepAfter",
                "fillOpacity": 0,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"atlas-apps\"}",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "cur {{horizontalpodautoscaler}}"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"atlas-apps\"}",
              "refId": "B",
              "range": true,
              "instant": false,
              "legendFormat": "des {{horizontalpodautoscaler}}"
            }
          ],
          "description": "Si desired>current, el HPA quiere escalar pero no puede (m\u00e9trica/recursos)."
        },
        {
          "id": 18,
          "type": "row",
          "title": "DLQ y retry \u2014 anomal\u00edas",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 47
          },
          "panels": []
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Backlog en DLQ por t\u00f3pico (acumulado)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 48
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (topic)(kafka_topic_partition_current_offset{topic=~\".*\\\\.dlq\"})",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{topic}}"
            }
          ],
          "description": "Crecimiento sostenido = anomal\u00edas reales (dlq-strategy pide alertar)."
        },
