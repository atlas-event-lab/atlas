              "editorMode": "code",
              "expr": "sum(rate(http_server_requests_seconds_count{job=~\"$service\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job=~\"$service\"}[5m])),1e-9)",
              "refId": "A",
              "range": false,
              "instant": true
