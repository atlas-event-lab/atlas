# Grafana dashboard — Atlas HTTP RED (per endpoint). Phase 7 / APM.
# Auto-loaded by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard: "1").
# Feeds off Micrometer http_server_requests_seconds_* (percentiles-histogram enabled in each
# service's application.yml). The $service variable auto-discovers values of the `job` label;
# if the dropdown is empty or wrong, change `job` to `pod`/`container` in the variable query.
# Apply:  kubectl apply -f atlas-red-dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-red-dashboard
  namespace: atlas-observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Atlas"
data:
  atlas-red-dashboard.json: |
    {
      "uid": "atlas-red-http",
      "title": "Atlas \u2014 HTTP RED (per endpoint)",
      "tags": [
        "atlas",
        "red",
        "apm",
        "phase7"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": {},
            "refresh": 1,
            "hide": 0
          },
          {
            "name": "service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "label": "Service",
            "query": {
              "query": "label_values(http_server_requests_seconds_count, job)",
              "refId": "var"
            },
            "definition": "label_values(http_server_requests_seconds_count, job)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "booking-service",
              "value": "booking-service"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Golden signals \u2014 $service",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Request rate",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(http_server_requests_seconds_count{job=~\"$service\"}[$__rate_interval]))",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Error rate (5xx)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
