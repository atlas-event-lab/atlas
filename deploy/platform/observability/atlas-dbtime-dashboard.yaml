# Grafana dashboard — Atlas · tiempo de DB: SQL vs idle-in-transaction.
# Auto-cargado por el sidecar de Grafana de kube-prometheus-stack (label grafana_dashboard: "1")
# y sincronizado por la app obs-config, cuyo include es un GLOB (*-dashboard.yaml): basta con
# que este archivo exista para que se instale en el próximo sync. NO requiere ningún cambio en
# el cluster: todas las métricas ya las exponen el PodMonitor del pooler (cnpg_pgbouncer_*), el
# collector de CNPG (cnpg_backends_*) y el Actuator de cada servicio (hikaricp_*).
#
# QUÉ RESPONDE. Del tiempo que una conexión pasa dentro de una transacción, cuánto se va en
# ejecutar SQL y cuánto en no hacer nada. PgBouncer define:
#     total_xact_time   µs conectado a Postgres dentro de una transacción (ejecutando O idle)
#     total_query_time  µs ejecutando queries
# La resta es, por definición, tiempo pineado sin trabajo de base de datos. En Atlas eso es
# típicamente la app llamando a otro servicio (booking → flight/hotel por Feign dentro de un
# @Transactional) o esperando acks de Kafka con la transacción abierta.
#
# CÓMO LEER LOS NÚMEROS. Todas las series de "conexiones equivalentes" son segundos de estado
# por segundo, es decir CONCURRENCIA MEDIA (ley de Little). Un valor de 2 significa "en promedio
# 2 conexiones estaban en ese estado en todo momento", y se compara directamente contra los
# backends físicos y contra default_pool_size.
#
# LO QUE ESTE DASHBOARD **NO** MIDE. Del tiempo ejecutando SQL no separa CPU de I/O de disco ni
# de esperas por lock: total_query_time es wall-clock indiferenciado, y PgBouncer está del lado
# equivocado del cable para distinguirlos. Ese desglose exigiría track_io_timing + contadores de
# pg_stat_database (y muestreo de wait events para los locks) — deliberadamente fuera de alcance.
#
# DECISIONES DE MÉTODO (por qué no se hizo de la forma obvia):
#   · Los promedios por transacción se derivan de CONTADORES (total_xact_time / total_xact_count)
#     y no de los gauges avg_xact_time / avg_query_time de PgBouncer: esos son medias sobre el
#     stats_period de cada pod, y promediar dos medias entre las 2 instancias del pooler da un
#     número incorrecto. Se suma numerador y denominador por separado.
#   · Los porcentajes llevan una guarda `and (rate(total_xact_count) > 0)`. Sin ella, un período
#     sin tráfico se dibuja como 100 % idle — el artefacto es 1 − 0/0.
#   · Los paneles de Hikari NO se cruzan con los de PgBouncer mediante label_replace. El
#     denominador de Hikari es el checkout, el de PgBouncer la transacción, y un checkout puede
#     contener varias transacciones: superponerlos exagera la brecha. Van lado a lado, en las
#     mismas unidades de concurrencia media, y la comparación la hace el ojo.
#   · La fila de pg_stat_activity está COLAPSADA y marcada: son gauges muestreados en el scrape,
#     no contadores. Sirven de confirmación cualitativa, no de medida. Por lo mismo no hay panel
#     de contención de locks: `cnpg_backends_waiting_total` es un gauge y una espera de lock de
#     milisegundos no aparece casi nunca — un panel así daría falsos negativos convincentes.
#   · La variable de instancia no tiene opción "All": pg_stat_activity es por instancia.
#
# VERIFICAR UNA VEZ (Explore de Grafana) antes de confiar en la fila de Hikari:
#   label_values(hikaricp_connections_usage_seconds_count, job)
# debe devolver nombres de servicio. Si tu PodMonitor etiqueta `job` de otra forma, cambia el
# `by (job)` de esos dos paneles por el label que corresponda.
#
# Aplicar:  kubectl apply -f atlas-dbtime-dashboard.yaml   (o dejar que Argo CD lo sincronice)
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-dbtime-dashboard
  namespace: atlas-observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Atlas"
data:
  atlas-dbtime-dashboard.json: |
    {
      "uid": "atlas-db-time",
      "title": "Atlas — DB time: SQL vs idle-in-transaction",
      "tags": [
        "atlas",
        "database",
        "pgbouncer",
        "pinning",
        "db-time"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "editable": true,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "database",
            "type": "custom",
            "label": "Base de datos",
            "description": "Bases de servicio multiplexadas por el pooler. 'All' = todas las *_db, así que una base nueva entra sola.",
            "query": "booking_db,inventory_db,travel_cart_db,payment_db,search_db,hotel_db,flight_db,user_db",
            "multi": true,
            "includeAll": true,
            "allValue": ".*_db",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "pginstance",
            "type": "query",
            "label": "Instancia Postgres",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(cnpg_backends_total, pod)",
              "refId": "var"
            },
            "refresh": 2,
            "multi": false,
            "includeAll": false,
            "description": "Solo afecta a la fila 'Confirmación desde Postgres'. SIN opción All a propósito: pg_stat_activity es por instancia y sumar primary + réplica da un número sin significado. Elige el primary.",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Resumen — ¿la conexión trabaja o espera?",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "% del tiempo de transacción SIN ejecutar SQL",
          "description": "PgBouncer mide total_xact_time (microsegundos conectado a Postgres DENTRO de una transacción: ejecutando SQL o idle-in-transaction) y total_query_time (solo ejecutando). La resta ES, por definición, tiempo con la conexión tomada sin hacer trabajo de base de datos — típicamente la app llamando a otro servicio o esperando un ack de Kafka con la transacción abierta. Verde <40 %, rojo >60 %. Sin tráfico el panel se oculta en vez de marcar 100 %.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 40
                  },
                  {
                    "color": "red",
                    "value": 60
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "area",
            "colorMode": "value",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "expr": "(100 * (1 - sum(rate(cnpg_pgbouncer_stats_total_query_time{database=~\"$database\"}[$__rate_interval])) / clamp_min(sum(rate(cnpg_pgbouncer_stats_total_xact_time{database=~\"$database\"}[$__rate_interval])), 1))) and (sum(rate(cnpg_pgbouncer_stats_total_xact_count{database=~\"$database\"}[$__rate_interval])) > 0)",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Conexiones equivalentes EJECUTANDO SQL",
          "description": "rate(total_query_time) en segundos por segundo = número medio de conexiones que en cualquier instante están realmente ejecutando SQL. Es la demanda REAL de conexiones. Compárala con los backends físicos del panel de al lado: la brecha es sobredimensionamiento del pool, no capacidad de base de datos.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
