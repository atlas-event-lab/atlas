            "colorMode": "value",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rate(cnpg_pgbouncer_stats_total_query_time{database=~\"$database\"}[$__rate_interval])) / 1e6",
              "legendFormat": "",
              "refId": "A"
