# Grafana dashboard — Atlas PgBouncer pooler (ADR-0032).
# Auto-loaded by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard: "1").
#
# Feeds off the CNPG PgBouncer exporter (cnpg_pgbouncer_*), scraped via the PodMonitor in
# deploy/platform/cloudnative-pg/pooler.yaml. The core question this answers:
#   LOGICAL connections  = clients app -> PgBouncer   : cnpg_pgbouncer_pools_cl_*
#   PHYSICAL connections = PgBouncer  -> Postgres      : cnpg_pgbouncer_pools_sv_*
# In transaction pool mode a few PHYSICAL server connections serve many LOGICAL clients — the
# ratio between them is the whole point of the pooler. Postgres-side backends vs the 200 cap
# come from the cluster collector (cnpg_backends_total / cnpg_pg_settings_setting max_connections).
#
# Note on labels: the CNPG exporter labels pool series by `database` (= <svc>_db) and `user`.
# If the per-database panel is empty, your exporter build may use `pool` instead of `database`.
#
# Apply:  kubectl apply -f pgbouncer-dashboard.yaml   (or let Argo CD sync it)
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-dashboard
  namespace: atlas-observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Atlas"
data:
  pgbouncer-dashboard.json: |
    {
      "uid": "atlas-pgbouncer-pooler",
      "title": "Atlas — PgBouncer Pooler (physical vs logical)",
      "tags": ["atlas", "pgbouncer", "pooler", "database", "connections"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Physical connections (PgBouncer → Postgres)",
          "description": "Real server-side connections held against Postgres: sum of sv_active + sv_idle + sv_used + sv_login + sv_tested. Bounded by default_pool_size (12) per (user,db) — this is what relieves max_connections.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum(cnpg_pgbouncer_pools_sv_active) + sum(cnpg_pgbouncer_pools_sv_idle) + sum(cnpg_pgbouncer_pools_sv_used) + sum(cnpg_pgbouncer_pools_sv_login) + sum(cnpg_pgbouncer_pools_sv_tested)", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "blue" }, "unit": "short", "decimals": 0 } },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Logical connections (app → PgBouncer)",
          "description": "Client-side connections multiplexed by the pooler: sum of cl_active + cl_waiting. These are cheap and can far exceed the physical count.",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum(cnpg_pgbouncer_pools_cl_active) + sum(cnpg_pgbouncer_pools_cl_waiting)", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "green" }, "unit": "short", "decimals": 0 } },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Multiplex ratio (logical / physical)",
          "description": "How many client connections each real server connection serves. > 1 means the pooler is doing its job; near 1 means little multiplexing (light load).",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "(sum(cnpg_pgbouncer_pools_cl_active) + sum(cnpg_pgbouncer_pools_cl_waiting)) / clamp_min(sum(cnpg_pgbouncer_pools_sv_active) + sum(cnpg_pgbouncer_pools_sv_idle) + sum(cnpg_pgbouncer_pools_sv_used) + sum(cnpg_pgbouncer_pools_sv_login) + sum(cnpg_pgbouncer_pools_sv_tested), 1)", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "purple" }, "unit": "none", "decimals": 1 } },
          "options": { "colorMode": "value", "graphMode": "none", "textMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Clients waiting (should be ~0)",
          "description": "cl_waiting — clients queued because no server connection was free in the pool. Sustained > 0 means default_pool_size is too small for the load. Any non-zero is worth noticing.",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum(cnpg_pgbouncer_pools_cl_waiting)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 10 } ] }
            }
          },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 5,
          "type": "gauge",
          "title": "Postgres backends vs max_connections (200)",
          "description": "sum(cnpg_backends_total) — the REAL backends open on Postgres from every source (pooler, Keycloak direct, Flyway at startup). The whole reason for the pooler is to keep this under the artificial max_connections cap (200).",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum(cnpg_backends_total)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "max": 200,
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 150 }, { "color": "red", "value": 185 } ] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdMarkers": true }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Max wait (oldest queued client)",
          "description": "max(cnpg_pgbouncer_pools_maxwait) — longest a client has currently been waiting for a server connection. Should be 0s in healthy state.",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "max(cnpg_pgbouncer_pools_maxwait)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 0.1 }, { "color": "red", "value": 1 } ] }
            }
          },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Avg wait time",
          "description": "max over pools of cnpg_pgbouncer_stats_avg_wait_time — average time a query waited for a server connection in the last stats period. Rising = pool saturation.",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "max(cnpg_pgbouncer_stats_avg_wait_time)", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "µs", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "text" } } },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Physical vs Logical connections",
          "description": "The core view: real server connections to Postgres (physical) against multiplexed client connections (logical). The gap between the two lines is the multiplexing the pooler buys you.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum(cnpg_pgbouncer_pools_sv_active) + sum(cnpg_pgbouncer_pools_sv_idle) + sum(cnpg_pgbouncer_pools_sv_used) + sum(cnpg_pgbouncer_pools_sv_login) + sum(cnpg_pgbouncer_pools_sv_tested)", "legendFormat": "physical (server → Postgres)", "refId": "A" },
            { "expr": "sum(cnpg_pgbouncer_pools_cl_active) + sum(cnpg_pgbouncer_pools_cl_waiting)", "legendFormat": "logical (app → PgBouncer)", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 12, "lineWidth": 2 }, "unit": "short" } }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Physical connections per database (cap: default_pool_size 12)",
          "description": "Server connections per pool = per <svc>_db. Each pool is bounded by default_pool_size (12). A pool pinned at 12 with clients waiting is the signal to raise it.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum by (database) (cnpg_pgbouncer_pools_sv_active + cnpg_pgbouncer_pools_sv_idle + cnpg_pgbouncer_pools_sv_used + cnpg_pgbouncer_pools_sv_login + cnpg_pgbouncer_pools_sv_tested)", "legendFormat": "{{database}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "stacking": { "mode": "normal" } }, "unit": "short" } }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Server connections by state",
          "description": "Breakdown of the physical pool: active (in a transaction), idle (parked, reusable), used (recently used), login (authenticating). Mostly-idle under light load is normal.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum(cnpg_pgbouncer_pools_sv_active)", "legendFormat": "active", "refId": "A" },
            { "expr": "sum(cnpg_pgbouncer_pools_sv_idle)", "legendFormat": "idle", "refId": "B" },
            { "expr": "sum(cnpg_pgbouncer_pools_sv_used)", "legendFormat": "used", "refId": "C" },
            { "expr": "sum(cnpg_pgbouncer_pools_sv_login)", "legendFormat": "login", "refId": "D" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 15, "stacking": { "mode": "normal" } }, "unit": "short" } }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Client connections by state",
          "description": "active = mapped to a server connection; waiting = queued for one. Any sustained waiting band means the physical pool is the bottleneck.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum(cnpg_pgbouncer_pools_cl_active)", "legendFormat": "active", "refId": "A" },
            { "expr": "sum(cnpg_pgbouncer_pools_cl_waiting)", "legendFormat": "waiting", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 15, "stacking": { "mode": "normal" } }, "unit": "short" } }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Throughput (queries & transactions /s)",
          "description": "rate of cnpg_pgbouncer_stats_total_query_count and total_xact_count. In transaction pool mode each transaction is what borrows/returns a server connection.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "sum(rate(cnpg_pgbouncer_stats_total_query_count[$__rate_interval]))", "legendFormat": "queries/s", "refId": "A" },
            { "expr": "sum(rate(cnpg_pgbouncer_stats_total_xact_count[$__rate_interval]))", "legendFormat": "transactions/s", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10 }, "unit": "reqps" } }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Avg wait time per database",
          "description": "cnpg_pgbouncer_stats_avg_wait_time by pool. Time queries spend waiting for a server connection — the saturation early-warning. Flat ~0 is healthy.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "max by (database) (cnpg_pgbouncer_stats_avg_wait_time)", "legendFormat": "{{database}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10 }, "unit": "µs" } }
        }
      ]
    }
