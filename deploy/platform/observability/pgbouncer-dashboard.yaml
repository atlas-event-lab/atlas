# Grafana dashboard — Atlas DB connections & PgBouncer pooler.
# Auto-cargado por el sidecar de Grafana de kube-prometheus-stack (label grafana_dashboard: "1").
#
# PROPOSITO: validar (o refutar) la hipotesis de CONNECTION PINNING.
#   Observado en el ultimo run: 120 conexiones fisicas contra una base que nunca paso de 1 CPU.
#   Si esas conexiones estuvieran ejecutando SQL harian falta ~120 cores. La hipotesis es que en
#   poolMode=transaction la conexion queda pineada desde BEGIN hasta COMMIT, y que la transaccion
#   pasa la mayor parte de su vida esperando I/O que NO es de base de datos:
#     - booking-service: BookingServiceImpl.createBooking es @Transactional y llama por Feign a
#       flight-service / hotel-service dentro de la transaccion (validateCatalogPrice).
#     - OutboxRelay (booking, inventory, payment): @Transactional que hace kafkaTemplate.flush() y
#       future.get() esperando acks=all, sosteniendo ademas FOR UPDATE sobre las filas del outbox.
#     - inventory-service: PESSIMISTIC_WRITE (SELECT ... FOR UPDATE) sobre vuelos y noches de habitacion.
#
# TRES FUENTES INDEPENDIENTES, una por fila del dashboard:
#   1. "Transaction pinning"  -> PgBouncer: total_xact_time vs total_query_time. La diferencia ES,
#      por definicion, tiempo pineado sin ejecutar SQL. Es la metrica que zanja el debate.
#   2. "Backend states"       -> Postgres: cnpg_backends_total por `state` (idle in transaction vs active)
#      y cnpg_backends_max_tx_duration_seconds.
#   3. "Hikari"               -> la app: cuanto retiene cada conexion, via Actuator, sin tocar codigo.
#   + "Lock contention"       -> cnpg_backends_waiting_total, para la parte de PESSIMISTIC_WRITE.
#
# COMO LEERLO EN UN RUN:
#   - Gauge "% del tiempo de transaccion SIN ejecutar SQL" > 60% => hipotesis confirmada.
#   - "Conexiones equivalentes EJECUTANDO SQL" es la demanda REAL de conexiones (ley de Little).
#     Comparar contra los backends fisicos: esa brecha es el sobredimensionamiento del pool.
#   - Con default_pool_size bajado a 8 (pooler.yaml) se espera que booking encole. Eso es
#     intencional: cl_waiting / total_wait_time subiendo mientras el % idle-in-tx sigue alto
#     demuestra que el pool actua como semaforo sobre transacciones largas, no como capacidad de BD.
#
# Metricas: collector de CNPG (cnpg_backends_*, cnpg_pg_stat_database_*), PodMonitor del pooler
# (cnpg_pgbouncer_*) y Actuator de cada servicio (hikaricp_*, label `job` = nombre del servicio).
# Aplicar:  kubectl apply -f pgbouncer-dashboard.yaml   (o dejar que Argo CD lo sincronice)
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-dashboard
  namespace: atlas-observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Atlas"
data:
  pgbouncer-dashboard.json: |
    {
      "uid": "atlas-pgbouncer-pooler",
      "title": "Atlas — DB connections & PgBouncer pooler",
      "tags": [
        "atlas",
        "pgbouncer",
        "pooler",
        "database",
        "connections",
        "pinning"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "5s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "pginstance",
            "type": "query",
            "label": "Postgres instance",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(cnpg_backends_total, pod)",
              "refId": "var"
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "description": "Instancias CNPG a incluir. Todo el trafico de las apps va al pooler rw -> primary, asi que la replica solo aporta backends de replicacion y del collector. Selecciona solo el primary para una cuenta limpia."
          }
        ]
      },
      "panels": [
        {
          "type": "gauge",
          "title": "Real backends vs max_connections (200)",
          "description": "sum(cnpg_backends_total) — las conexiones REALES del lado servidor en Postgres (pg_stat_activity). Tope duro en max_connections (200). Esta es la cifra autoritativa de 'conexiones fisicas'; la vista sv_* de pgBouncer se removio porque sobrecontaba estados transitorios. OJO: con $pginstance = All esto suma primary + replica.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1,
              "min": 0,
              "max": 200,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 150
                  },
                  {
                    "color": "red",
                    "value": 185
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "expr": "sum(cnpg_backends_total{pod=~\"$pginstance\"})",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Logical clients (app -> PgBouncer)",
          "description": "cl_active + cl_waiting — conexiones cliente hacia PgBouncer (baratas, multiplexadas). Acotadas por max_client_conn (200 por instancia, pooler.yaml).",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(cnpg_pgbouncer_pools_cl_active) + sum(cnpg_pgbouncer_pools_cl_waiting)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Multiplex ratio (clients per real backend)",
          "description": "clientes logicos / backends reales de Postgres. En poolMode=transaction un ratio sano es >= 10:1. Un ratio cercano a 2:1 es la firma de transacciones LARGAS: la conexion no se devuelve al pool porque la transaccion sigue abierta esperando I/O.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1,
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "(sum(cnpg_pgbouncer_pools_cl_active) + sum(cnpg_pgbouncer_pools_cl_waiting)) / clamp_min(sum(cnpg_backends_total{pod=~\"$pginstance\"}), 1)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Real backends per service",
          "description": "cnpg_backends_total por datname — backends reales por base, es decir por servicio (database-per-service). Techo por servicio = default_pool_size x 2 instancias de PgBouncer (8 x 2 = 16). Una linea clavada en el techo = ese pool esta saturado.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12,
                "lineWidth": 2
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (datname) (cnpg_backends_total{pod=~\"$pginstance\"})",
              "legendFormat": "{{datname}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Real backends (total) vs logical clients",
          "description": "El multiplexado en el tiempo: backends reales de Postgres contra las conexiones cliente multiplexadas hacia PgBouncer. El hueco entre ambas es lo que compra el pooling.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12,
                "lineWidth": 2
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(cnpg_backends_total{pod=~\"$pginstance\"})",
              "legendFormat": "real backends (Postgres)",
              "refId": "A"
            },
            {
              "expr": "sum(cnpg_pgbouncer_pools_cl_active) + sum(cnpg_pgbouncer_pools_cl_waiting)",
              "legendFormat": "logical clients (PgBouncer)",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Clients waiting",
          "description": "cl_waiting — clientes encolados porque no habia server connection libre en el pool. Con default_pool_size: 8 se ESPERA ver esto > 0 en booking (llego a 32 fisicas en el ultimo run, el techo ahora es 16). Sostenido > 0 significa que el pool es el semaforo. CAVEAT: cl_waiting es un gauge muestreado cada scrape; esperas de milisegundos NO se ven aqui. Para esperas cortas usar 'Wait time acumulado' abajo, que viene de un contador y no se pierde nada.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12,
                "lineWidth": 2
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (database) (cnpg_pgbouncer_pools_cl_waiting)",
              "legendFormat": "{{database}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Wait time (max queued & avg)",
          "description": "maxwait = cuanto lleva esperando el cliente mas antiguo en cola; avg_wait_time = espera media por obtener una server connection. Subiendo = saturacion del pool.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12,
                "lineWidth": 2
              },
              "unit": "s"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "max(cnpg_pgbouncer_pools_maxwait)",
              "legendFormat": "max wait (s)",
              "refId": "A"
            },
            {
              "expr": "max(cnpg_pgbouncer_stats_avg_wait_time) / 1e6",
              "legendFormat": "avg wait (s)",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Throughput (queries & transactions /s)",
          "description": "rate de total_query_count y total_xact_count. En poolMode=transaction cada TRANSACCION es lo que toma y devuelve una server connection. queries/xact alto = transacciones con mucho SQL; queries/xact ~1 con transacciones largas = la transaccion esta esperando, no consultando.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12,
                "lineWidth": 2
              },
              "unit": "reqps"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(cnpg_pgbouncer_stats_total_query_count{database=~\".*_db\"}[$__rate_interval]))",
              "legendFormat": "queries/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(cnpg_pgbouncer_stats_total_xact_count{database=~\".*_db\"}[$__rate_interval]))",
              "legendFormat": "transactions/s",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Wait time acumulado por base (contador)",
          "description": "rate(total_wait_time) — segundos de espera por segundo, por base. A diferencia de cl_waiting este viene de un CONTADOR, asi que captura esperas de milisegundos que el gauge se pierde entre scrapes. Si esto es > 0 mientras 'Clients waiting' marca 0, el pool SI estaba encolando.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12,
                "lineWidth": 2
              },
              "unit": "s",
              "decimals": 3
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (database) (rate(cnpg_pgbouncer_stats_total_wait_time{database=~\".*_db\"}[$__rate_interval])) / 1e6",
              "legendFormat": "{{database}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Transaction pinning — la conexion, trabaja o espera?",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "panels": []
        },
        {
          "type": "gauge",
          "title": "% del tiempo de transaccion SIN ejecutar SQL",
          "description": "1 - (total_query_time / total_xact_time). PgBouncer define total_xact_time como los microsegundos conectado a Postgres DENTRO de una transaccion (idle-in-transaction + ejecutando) y total_query_time como los microsegundos ejecutando queries. La diferencia es, por definicion, tiempo en que la server connection estuvo PINEADA sin hacer nada.\n\nESTA ES LA METRICA QUE ZANJA LA HIPOTESIS. Si esto marca > 60%, las conexiones no son capacidad de base de datos: son transacciones esperando I/O (Feign a flight/hotel-service dentro de @Transactional, acks de Kafka dentro del OutboxRelay, esperas de lock en PESSIMISTIC_WRITE).",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 31
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 30
                  },
                  {
                    "color": "red",
                    "value": 60
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "expr": "100 * (1 - (sum(rate(cnpg_pgbouncer_stats_total_query_time{database=~\".*_db\"}[$__rate_interval]))) / clamp_min(sum(rate(cnpg_pgbouncer_stats_total_xact_time{database=~\".*_db\"}[$__rate_interval])), 1))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Conexiones equivalentes EJECUTANDO SQL",
          "description": "rate(total_query_time) en segundos/segundo. Por la ley de Little esto ES el numero medio de conexiones que realmente estaban ejecutando SQL. Comparar con el gauge de backends fisicos arriba: esta es la cantidad de conexiones que la base de datos de verdad necesita. Si Postgres nunca paso de 1 CPU, este numero deberia rondar 1-2.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 31
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "(sum(rate(cnpg_pgbouncer_stats_total_query_time{database=~\".*_db\"}[$__rate_interval]))) / 1e6",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Conexiones equivalentes IDLE IN TRANSACTION",
          "description": "rate(total_xact_time - total_query_time) en segundos/segundo = numero medio de conexiones fisicas retenidas sin ejecutar nada. Es el desperdicio: cada una cuesta ~5-10MB de RAM en Postgres y un slot de max_connections, y no aporta throughput.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 31
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "((sum(rate(cnpg_pgbouncer_stats_total_xact_time{database=~\".*_db\"}[$__rate_interval]))) - (sum(rate(cnpg_pgbouncer_stats_total_query_time{database=~\".*_db\"}[$__rate_interval])))) / 1e6",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Descomposicion de conexiones: fisicas vs ejecutando SQL vs pineadas",
          "description": "EL PANEL DE LA HIPOTESIS. Tres series:\n  - backends fisicos: lo que Postgres tiene abierto (llego a 120 en el ultimo run).\n  - ejecutando SQL: rate(total_query_time), la demanda real de la base de datos.\n  - idle in transaction: rate(total_xact_time - total_query_time), conexiones pineadas esperando.\n\nSi 'ejecutando SQL' se queda en ~1-2 mientras 'backends fisicos' esta en 120, la regla 'pool = 2 x cores' nunca aplico: no estabas midiendo trabajo de base de datos.",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineWidth": 2
              },
              "unit": "short",
              "decimals": 2
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(cnpg_backends_total{datname=~\".*_db\", pod=~\"$pginstance\"})",
              "legendFormat": "backends fisicos (Postgres)",
              "refId": "A"
            },
            {
              "expr": "(sum(rate(cnpg_pgbouncer_stats_total_query_time{database=~\".*_db\"}[$__rate_interval]))) / 1e6",
              "legendFormat": "ejecutando SQL",
              "refId": "B"
            },
            {
              "expr": "((sum(rate(cnpg_pgbouncer_stats_total_xact_time{database=~\".*_db\"}[$__rate_interval]))) - (sum(rate(cnpg_pgbouncer_stats_total_query_time{database=~\".*_db\"}[$__rate_interval])))) / 1e6",
              "legendFormat": "idle in transaction",
              "refId": "C"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "% idle-in-transaction por base de datos",
