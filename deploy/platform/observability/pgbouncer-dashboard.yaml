# Grafana dashboard — Atlas DB connections & PgBouncer pooler (ADR-0032).
# Auto-loaded by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard: "1").
#
# PHYSICAL / real connections come from Postgres itself — `cnpg_backends_total` (pg_stat_activity),
# the authoritative count, hard-capped at max_connections (200), broken down per service via its
# `datname` label. The pgBouncer server-side `sv_*` "physical" metrics were REMOVED: summed across
# the 2 HA pooler pods plus transient sv_login/sv_tested states they over-counted and could exceed
# 200, which is impossible for real backends — misleading. pgBouncer metrics are kept only for the
# CLIENT side (cl_*) and wait/throughput, which is what they measure well.
#
# Fed by the CNPG collector (cnpg_backends_total) + the pooler PodMonitor (cnpg_pgbouncer_*).
# Apply:  kubectl apply -f pgbouncer-dashboard.yaml   (or let Argo CD sync it)
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-dashboard
  namespace: atlas-observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Atlas"
data:
  pgbouncer-dashboard.json: |
    {
      "uid": "atlas-pgbouncer-pooler",
      "title": "Atlas — DB connections & PgBouncer pooler",
      "tags": [
        "atlas",
        "pgbouncer",
        "pooler",
        "database",
        "connections"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "5s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "gauge",
          "title": "Real backends vs max_connections (200)",
          "description": "sum(cnpg_backends_total) — the REAL server-side connections on Postgres (pg_stat_activity), across all sources. Hard-capped at max_connections (200). This is the authoritative 'physical connections' number; the pgBouncer sv_* view was removed (it over-counted transient states).",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(cnpg_backends_total)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "max": 200,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 150
                  },
                  {
                    "color": "red",
                    "value": 185
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdMarkers": true
          }
        },
        {
          "type": "stat",
          "title": "Logical clients (app → PgBouncer)",
          "description": "cl_active + cl_waiting — client connections into PgBouncer (cheap, multiplexed). Bounded by max_client_conn (400).",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(cnpg_pgbouncer_pools_cl_active) + sum(cnpg_pgbouncer_pools_cl_waiting)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Multiplex ratio (clients per real backend)",
          "description": "logical clients / real Postgres backends. > 1 means the pooler is genuinely multiplexing many clients onto few real connections.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "(sum(cnpg_pgbouncer_pools_cl_active) + sum(cnpg_pgbouncer_pools_cl_waiting)) / clamp_min(sum(cnpg_backends_total), 1)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1,
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Real backends per service",
          "description": "sum by (datname) (cnpg_backends_total): real Postgres backends per database — i.e. per service (database-per-service). If a line pins high it is that service holding the most connections. (If empty, the label may be 'database' instead of 'datname' in your CNPG build.)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "targets": [
            {
              "expr": "sum by (datname) (cnpg_backends_total)",
              "legendFormat": "{{datname}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Real backends (total) vs logical clients",
          "description": "The multiplexing over time: real Postgres backends (cnpg_backends_total) against the multiplexed client connections into PgBouncer. The gap is what pooling buys.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "targets": [
            {
              "expr": "sum(cnpg_backends_total)",
              "legendFormat": "real backends (Postgres)",
              "refId": "A"
            },
            {
              "expr": "sum(cnpg_pgbouncer_pools_cl_active) + sum(cnpg_pgbouncer_pools_cl_waiting)",
              "legendFormat": "logical clients (PgBouncer)",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Clients waiting",
          "description": "sum(cnpg_pgbouncer_pools_cl_waiting) over time — clients queued because no server connection was free in the pool. Sustained > 0 means default_pool_size (12) is too small for the load, even while Postgres has backend headroom.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "targets": [
            {
              "expr": "sum(cnpg_pgbouncer_pools_cl_waiting)",
              "legendFormat": "clients waiting",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Wait time (max queued & avg)",
          "description": "max(pools_maxwait) = how long the oldest queued client has waited; max(stats_avg_wait_time) = average query wait for a server connection. Rising = pool saturation.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12
              },
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "max(cnpg_pgbouncer_pools_maxwait)",
              "legendFormat": "max wait (s)",
              "refId": "A"
            },
            {
              "expr": "max(cnpg_pgbouncer_stats_avg_wait_time) / 1e6",
              "legendFormat": "avg wait (s)",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Throughput (queries & transactions /s)",
          "description": "rate of cnpg_pgbouncer_stats_total_query_count and total_xact_count. In transaction pool mode each transaction is what borrows/returns a server connection.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12
              },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(cnpg_pgbouncer_stats_total_query_count[$__rate_interval]))",
              "legendFormat": "queries/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(cnpg_pgbouncer_stats_total_xact_count[$__rate_interval]))",
              "legendFormat": "transactions/s",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Avg wait per database",
          "description": "cnpg_pgbouncer_stats_avg_wait_time by pool (per <svc>_db). Time queries spend waiting for a server connection — the saturation early-warning per service.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 12
              },
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "max by (database) (cnpg_pgbouncer_stats_avg_wait_time) / 1e6",
              "legendFormat": "{{database}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
