# Helm values for Grafana Loki (single-binary, lab profile). Phase 6b.
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts && helm repo update
#   helm upgrade --install loki grafana/loki -n atlas-observability -f loki-values.yaml
#
# NOTE: the grafana/loki chart is version-sensitive. After install, verify the query
# service name (used by the Grafana datasource + Alloy):  kubectl get svc -n atlas-observability | grep loki
# (single-binary usually exposes `loki` and a `loki-gateway`).

deploymentMode: SingleBinary

loki:
  auth_enabled: false                 # single-tenant lab
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  storage:
    type: filesystem
  limits_config:
    retention_period: 168h            # 7 days
    volume_enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    # storageClass: <name>            # omitted → cluster's DEFAULT StorageClass. Set to pin one.
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }

# Disable the scalable-mode components and heavy extras (lab).
read:     { replicas: 0 }
write:    { replicas: 0 }
backend:  { replicas: 0 }
chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }

# Fully-qualify the sidecar image registry. The chart defaults to the short name
# `kiwigrid/k8s-sidecar`, which container runtimes that enforce short-name resolution
# (Oracle Linux / OKE nodes: `short-name-mode = "enforcing"`) reject as ambiguous — the
# `loki-sc-rules` container then never starts (ImageInspectError) and the app hangs
# Progressing. Pinning `docker.io/` resolves to the exact same image everywhere (it's the
# form permissive runtimes like Civo's already produce), so this is vendor-agnostic, not
# vendor-specific. Tag is inherited from the chart.
sidecar:
  image:
    repository: docker.io/kiwigrid/k8s-sidecar
