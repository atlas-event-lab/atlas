# Keycloak (operator-managed, CNPG-backed). README Step 4.
#
# Operator install (no official Helm chart — apply the release manifests; pin <ver>, e.g. 26.0.5):
#   V=26.0.5
#   kubectl apply -n atlas-system \
#     -f https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/$V/kubernetes/keycloaks.k8s.keycloak.org-v1.yml \
#     -f https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/$V/kubernetes/keycloakrealmimports.k8s.keycloak.org-v1.yml
#   kubectl apply -n atlas-system \
#     -f https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/$V/kubernetes/kubernetes.yml
#
# Produces Service: keycloak-service.atlas-system:8080  → issuer matches the Helm values.
# DB creds come from the keycloak-db-secret created by create-db-secrets.sh (keys username/password).
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: atlas-system
spec:
  instances: 1
  # Compute resources. The operator's own defaults set MEMORY only (1700Mi/2Gi) and leave CPU
  # unset — which is a trap: on first start Keycloak runs a Quarkus augmentation ("Changes
  # detected in configuration. Updating the server image."), and that build is CPU-bound. With
  # no CPU request the scheduler places the pod without reserving any, so under contention it
  # is starved, blows the operator's 600s startup probe, gets SIGKILLed (exit 137), and the
  # replacement pod starts the same build from scratch — an unbounded restart loop.
  # The request below is what keeps it off that cliff; the limit lets the build burst.
  resources:
    requests:
      cpu: 500m
      memory: 1700Mi
    limits:
      cpu: "2"
      memory: 2Gi
  db:
    vendor: postgres
    host: atlas-pg-rw.atlas-data
    port: 5432
    database: keycloak_db
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true              # TLS terminated at the Ingress edge (HTTP inside)
  hostname:
    # Public hostname via nip.io (resolves to the ingress LoadBalancer IP, no DNS needed).
    # Used for the admin/account console in the browser AND as the token issuer (iss).
    # Services set KEYCLOAK_ISSUER_URI to this same URL + /realms/atlas so validation matches.
    # Replace the IP if the ingress LoadBalancer IP changes.
    hostname: http://keycloak.<cluster-ip>.nip.io
    strict: false
  proxy:
    headers: xforwarded            # trust X-Forwarded-* from the ingress
