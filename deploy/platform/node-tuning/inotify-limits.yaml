# Raise the nodes' inotify limits (Phase 7 prep — fsnotify "too many open files").
#
# WHY: fs.inotify.max_user_instances (default ~128) is a NODE-level, PER-UID kernel limit,
# shared by every process of that UID on the node. All Atlas Java services run as the same
# UID (1001, runAsUser in the Helm chart), so every Spring pod scheduled onto a node draws
# from the SAME inotify-instance budget for user 1001. Packing more of them per node (HPA +
# max-pods=30) exhausts it, and JVMs then log:
#   failed to create fsnotify watcher: too many open files
#
# fs.inotify.* is NOT a namespaced (per-pod) sysctl, so it can't be set via a pod
# securityContext — it must be set on the node. This DaemonSet does that on every node,
# including new ones from a node-pool recycle, so it self-heals across Phase 7 churn.
#
# APPLY:  kubectl apply -f deploy/platform/node-tuning/inotify-limits.yaml
# (Alternative, more permanent: bake these sysctls into the OKE node-pool cloud-init.)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-sysctl-inotify
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-sysctl-inotify
    app.kubernetes.io/part-of: atlas-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-sysctl-inotify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-sysctl-inotify
    spec:
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 5
      # An initContainer applies the sysctl once at pod start (and on every node/pod
      # restart); the pause container just keeps the DaemonSet pod alive afterwards.
      initContainers:
        - name: raise-inotify
          image: busybox:1.36
          securityContext:
            privileged: true          # required to write host kernel sysctls
          command:
            - sh
            - -c
            - |
              set -e
              sysctl -w fs.inotify.max_user_instances=1024
              sysctl -w fs.inotify.max_user_watches=524288
              echo "inotify limits raised:"; sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits:   { cpu: 20m, memory: 16Mi }
      tolerations:
        - operator: Exists            # run on every node, regardless of taints
