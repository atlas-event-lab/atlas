# Redis — cache for booking-service (exchange-rate table cache, 15m TTL).
# Lives in the data tier (atlas-data) alongside Postgres/Kafka; booking reaches it at
#   REDIS_HOST=redis.atlas-data  REDIS_PORT=6379  (see values/booking.yaml).
#
# Cache-only (ephemeral): no persistence (--save "" --appendonly no), bounded memory with
# LRU eviction. Losing the cache is harmless — booking refetches from the Frankfurter API.
# Single standalone pod for now (booking-only). Revisit HA / more consumers later.
#
# Apply:  kubectl apply -f deploy/platform/redis/redis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: atlas-data
  labels: { app: redis, app.kubernetes.io/part-of: atlas }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, app.kubernetes.io/part-of: atlas }
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7.4-alpine   # fully-qualified: OKE enforces short-name resolution
          args:
            - "redis-server"
            - "--maxmemory"
            - "192mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--save"
            - ""
            - "--appendonly"
            - "no"
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: atlas-data
  labels: { app: redis }
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
