#   atlas-data           — stateful: CloudNativePG (Postgres), Strimzi (Kafka), Kafka UI
#   atlas-apps           — the 9 Spring Boot services + wiremock (fake payment provider)
#   atlas-observability  — Grafana LGTM stack (Runbook §7 · deploy/platform/observability)
apiVersion: v1
kind: Namespace
metadata:
  name: atlas-system
  labels:
    atlas.dev/tier: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: atlas-observability
  labels:
    atlas.dev/tier: observability
---
apiVersion: v1
kind: Namespace
metadata:
  name: atlas-data
  labels:
    atlas.dev/tier: data
---
apiVersion: v1
kind: Namespace
metadata:
  name: atlas-apps
  labels:
    atlas.dev/tier: apps
