apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: inventory.reserved
  namespace: atlas-data
  labels:
    strimzi.io/cluster: atlas
spec:
  # 6 -> 12 (ADR-0016 / consumer-capacity-scaling.md): payment = 4 pods x concurrency 3 = 12
  # consumers. Producer keys by bookingId → per-booking order preserved. NOTE: inventory.reserved
  # is consumed by BOTH payment and booking, each with per-consumer retry/DLT topics (ADR-0023 /
  # ADR-0024): @RetryableTopic auto-creates inventory.reserved-payment-retry-0..2 + -payment.dlq
  # and inventory.reserved-booking-retry-0..2 + -booking.dlq; confirm/raise their partition count
  # to match so retries don't serialize on fewer partitions (ADR-0015 §3).
  # Partition counts can only be raised, never lowered.
  partitions: 12
  replicas: 3
  config:
    retention.ms: "604800000"
---
