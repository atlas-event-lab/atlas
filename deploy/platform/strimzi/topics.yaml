# KafkaTopic CRs — names from each service's EventTopics.java (code is the source of truth).
# metadata.name is the real topic name (dots are valid k8s object names). The only exception
# is payment.timed_out — underscores are invalid in object names, so it uses a sanitized
# metadata.name + an explicit spec.topicName carrying the real name.
# partitions=3 (parallel consumers for HPA experiments; inventory.reserved raised to 6 — §3).
# replicas=3 (RF=3 across the 3 brokers). Raising replicas on EXISTING topics needs Cruise
# Control to reassign (payment-service-scaling.md §7.5); it is not applied by editing alone.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: booking.created
  namespace: atlas-data
  labels:
    strimzi.io/cluster: atlas
spec:
  # 6 -> 9 (ADR-0016 / consumer-capacity-scaling.md): inventory saga = 3 pods x concurrency 3 = 9
  # consumers. Producer (booking OutboxRelay) keys by bookingId → per-booking order kept.
  partitions: 9
  replicas: 3
  config:
    retention.ms: "604800000"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: booking.confirmed
  namespace: atlas-data
  labels:
    strimzi.io/cluster: atlas
spec:
  # 6 -> 9 (ADR-0016 / consumer-capacity-scaling.md): matches inventory 3 pods x concurrency 3 = 9.
  # Producer keys by bookingId → per-booking order preserved across the added partitions.
  partitions: 9
  replicas: 3
  config:
    retention.ms: "604800000"
---
