# PgBouncer connection pooler for Atlas (ADR-0032 — relieve max_connections: 200).
#
# WHY: under load/HPA the stateless services scale to 3–4 pods each; every pod's Hikari
# pool opens direct connections to Postgres. Without pooling, aggregate client connections
# blow past the cluster's `max_connections: 200` (see cluster.yaml) — an ARTIFICIAL limit,
# not a real resource one. PgBouncer multiplexes many short app transactions over a small,
# bounded set of real server connections, so `max_connections` stops being the bottleneck.
#
# HOW IT WORKS (CNPG native Pooler CRD):
#   - One `rw` pooler in front of the primary (atlas-pg-rw). It sets only the `*` fallback
#     database, so the dbname in each client connection string is passed through to
#     Postgres. => a SINGLE pooler serves ALL service databases (booking_db, search_db, …).
#   - Auth is handled automatically by the operator (auth_query via a dedicated
#     `cnpg_pooler_pgbouncer` role + TLS cert). No manual SQL, no extra secrets.
#   - Creates a Service `atlas-pg-pooler-rw` (port 5432) that apps connect to instead of
#     `atlas-pg-rw`.
#
# POOL MODE = transaction: the multiplexing mode. A server connection is returned to the
#   pool at the end of each transaction, so few server conns serve many clients.
#   CAVEAT: server-side prepared statements and session state don't survive across
#   transactions. Apps MUST disable server-side prepared statements — append
#   `?prepareThreshold=0` to the JDBC DB_URL when cutting a service over. Flyway keeps a
#   DIRECT connection to atlas-pg-rw (its session-level lock is unsafe here) — see ADR-0033.
#
# GITOPS: synced by the Argo app deploy/argocd/apps/35-cnpg-pooler.yaml (wave 4, after the
# Cluster is Ready). The Pooler name MUST differ from the Cluster name (atlas-pg).
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: atlas-pg-pooler-rw
  namespace: atlas-data
spec:
  cluster:
    name: atlas-pg                   # immutable; points at the primary (rw) service
  instances: 2                       # HA: 2 PgBouncer pods, spread by anti-affinity below
  type: rw

  pgbouncer:
    poolMode: transaction
    parameters:
      # Accept many app-side connections; they're cheap and multiplexed.
      max_client_conn: "200"
      # Real server connections per (user,database) pair, PER PgBouncer INSTANCE.
      #
      # GUARD RAIL — el peor caso agregado DEBE caber en max_connections (200, cluster.yaml).
      # Bases multiplexadas por este pooler: 8, NO 9. keycloak_db no cuenta: Keycloak apunta
      # directo a atlas-pg-rw (deploy/platform/keycloak/keycloak.yaml), igual que Flyway.
      #
      #   peor caso pooler = 8 bases x default_pool_size x 2 instancias
      #     16 -> 256  +conexiones directas => ~306  ROMPE max_connections
      #     12 -> 192  +conexiones directas => ~242  ROMPE max_connections
      #      8 -> 128  +conexiones directas => ~178  CABE
      #
      # "Conexiones directas" (~50, no pasan por el pooler y por tanto son ADITIVAS):
      # Keycloak, el Flyway de cada pod al arrancar (8 servicios x hasta 4 replicas, ADR-0033),
      # el walsender de replicacion, el collector de CNPG y superuser_reserved_connections (3).
      #
      # Con 8 el techo fisico por servicio baja a 16. booking-service llego a 32 en el ultimo
      # run, asi que se espera que vuelva a encolar: cl_waiting y maxwait DEBEN dispararse.
      # Eso es intencional — es la evidencia de que el pool actua como semaforo sobre
      # transacciones largas, no como capacidad de base de datos. Cruzar con la fila
      # "Transaction pinning" del dashboard atlas-pgbouncer-pooler: si el tiempo idle-in-
      # transaction domina, el pool no es el problema, la duracion de la transaccion lo es.
      default_pool_size: "8"
      min_pool_size: "0"             # no idle server conns while services are pre-cutover
      # A 0 a proposito: con 3, cada pool podia estallar a 4 por instancia justo
      # cuando hay espera sostenida, que es el escenario que el experimento provoca.
      reserve_pool_size: "0"
      reserve_pool_timeout: "3"
      server_idle_timeout: "120"
      # Surface pooler errors in logs during the experiments.
      log_pooler_errors: "1"

  # Small footprint — mindful of the ~45-pod node cap (see deployment-roadmap §10.5).
  template:
    metadata:
      labels:
        app: atlas-pg-pooler-rw
    spec:
      containers: []                 # required by the PodSpec schema; operator injects pgbouncer
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - { key: app, operator: In, values: [atlas-pg-pooler-rw] }
                topologyKey: kubernetes.io/hostname
---
# Prometheus scrape for the pooler (Phase 6 integration).
# The operator's built-in enablePodMonitor is deprecated, so we own this PodMonitor.
# kube-prometheus-stack picks it up (podMonitorSelectorNilUsesHelmValues: false).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: atlas-pg-pooler-rw
  namespace: atlas-data
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
spec:
  selector:
    matchLabels:
      cnpg.io/poolerName: atlas-pg-pooler-rw
  podMetricsEndpoints:
    - port: metrics                  # PgBouncer exporter on :9127 -> cnpg_pgbouncer_* metrics
