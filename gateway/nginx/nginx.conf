# ─────────────────────────────────────────────────────────────
# Atlas API Gateway — Nginx reverse proxy
#
# Único punto de entrada al clúster. Todo el tráfico entra por
# el puerto 80 y se enruta por path a cada microservicio, usando
# el nombre del contenedor + su puerto INTERNO en la red Docker.
#
# Las rutas derivan de los contratos OpenAPI (todos cuelgan de
# /api/v1). NO se inventan endpoints: solo se reenvía por prefijo.
#
#   /api/v1/bookings    → booking-service:8080
#   /api/v1/flights     → flight-service:8080
#   /api/v1/hotels      → hotel-service:8080
#   /api/v1/inventory   → inventory-service:8080
#   /api/v1/search      → search-service:8080
#   /api/v1/me/bookings → search-service:8080   (más específico que /me/)
#   /api/v1/me/         → user-service:8080     (profile, preferences, favorites)
#   /api/v1/payments    → payment-service:8080
#   /api/v1/carts       → travel-cart-service:8080
#
# wiremock y postgres-cart NO se exponen aquí (uso interno del clúster).
# ─────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Tamaños/timeouts razonables para una API JSON
    client_max_body_size 10m;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    server {
        listen 80;
        server_name _;

        # Headers comunes heredados por todas las locations
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        # Health-check del propio gateway
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "gateway ok\n";
        }

        # ── Booking ──────────────────────────────────────────
        location /api/v1/bookings {
            proxy_pass http://booking-service:8080;
        }

        # ── Flight (catálogo admin) ──────────────────────────
        location /api/v1/flights {
            proxy_pass http://flight-service:8080;
        }

        # ── Hotel (catálogo admin) ───────────────────────────
        location /api/v1/hotels {
            proxy_pass http://hotel-service:8080;
        }

        # ── Inventory (saga participant) ─────────────────────
        location /api/v1/inventory {
            proxy_pass http://inventory-service:8080;
        }

        # ── Search (CQRS read side) ──────────────────────────
        location /api/v1/search {
            proxy_pass http://search-service:8080;
        }

        # /api/v1/me/bookings pertenece a Search.
        # Es un prefijo más largo que /api/v1/me/, así que nginx
        # lo prioriza automáticamente sobre la ruta de user-service.
        location /api/v1/me/bookings {
            proxy_pass http://search-service:8080;
        }

        # ── User (self-service: profile / preferences / favorites) ──
        location /api/v1/me/ {
            proxy_pass http://user-service:8080;
        }

        # ── Payment (saga participant) ───────────────────────
        location /api/v1/payments {
            proxy_pass http://payment-service:8080;
        }

        # ── Travel Cart ──────────────────────────────────────
        location /api/v1/carts {
            proxy_pass http://travel-cart-service:8080;
        }
    }
}
